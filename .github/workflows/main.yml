name: Next deploy

on:
  push:
    branches: [release]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Deploy using ssh
      uses: appleboy/ssh-action@master
      with: 
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        password: ${{ secrets.PASSWORD }}
        port: 22
        envs: GH_PAT  # <== TRUYỀN biến GH_PAT vào máy chủ SSH
        script: |
          cd /home/wiwa*
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git remote set-url origin https://x-access-token:$GH_PAT@github.com/TrongKim/wiwa-wiki-repo.git
          git fetch origin
          git checkout release
          git pull

          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use 22.16.0
          node -v
          npm -v
          npm install
          /run/user/0/fnm_multishells/11068_1767781578403/bin/pm2 reload wiwabeacon
      env:
        GH_PAT: ${{ secrets.GH_PAT }}  # <== Gắn secret vào biến GH_PAT để truyền qua envs
